<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F0552B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>Controle · Transportadora</title>
<style>
:root{--bg:#F3F3F6;--panel:#fff;--panel2:#F7F7FA;--line:#E7E7EE;--field:#fff;--tx:#1E1E24;--mut:#6B6B78;--pri:#F0552B;--priTx:#fff;--pri-d:#DC4A21;--gn:#16B13F;--gn-d:#3C8D40;--ok:#138A35;--okb:#E5F6EA;--wa:#D8461B;--wab:#FFF0E8;--er:#C62828;--erb:#FDECEA;--card:var(--panel);--bd:var(--line);--cy:var(--tx);color-scheme:light}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--tx);background:var(--bg);font:15px/1.5 Poppins,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.hide{display:none!important}
button,select{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.box{width:100%;max-width:380px;background:var(--panel);border-radius:16px;padding:28px 24px;box-shadow:0 8px 30px rgba(30,30,36,.08)}
.logo{display:flex;align-items:center;gap:10px;font-weight:600;font-size:18px}
.box .logo{margin-bottom:18px}
.box h2{font-size:22px;margin:0 0 4px;font-weight:600}
.box p{margin:0 0 14px;color:var(--mut);font-size:14px}
label{display:block;font-size:12.5px;color:var(--mut);margin:12px 0 5px;font-weight:500}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--field);color:var(--tx);font:inherit;transition:border-color .15s,box-shadow .15s}
input::placeholder,textarea::placeholder{color:#A0A0AC}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--pri);box-shadow:0 0 0 3px rgba(240,85,43,.15)}
button{font:inherit;font-weight:500;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--tx);padding:10px 16px;transition:background .15s,border-color .15s,filter .15s}
button:hover{border-color:#CFCFDA}
button:active{transform:translateY(1px)}
button:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
button.p{background:var(--pri);border-color:var(--pri);color:var(--priTx);font-weight:600;text-transform:uppercase;letter-spacing:.02em;font-size:14px}
button.p:hover{background:var(--pri-d);border-color:var(--pri-d)}
button.d{color:var(--er)}button.d:hover{background:var(--erb);border-color:var(--er)}
button:disabled{opacity:.6;cursor:wait}
.err{color:var(--er);font-size:13.5px;min-height:20px;margin-top:8px}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
header .logo span{font-size:17px}
#pt{display:none;font-weight:600;font-size:17px}
header nav{display:flex;gap:4px;background:var(--bg);border-radius:12px;padding:4px}
nav button{border:0;background:transparent;padding:8px 18px;color:var(--mut);font-weight:500;border-radius:9px}
nav button:hover{background:#E9E9EF}
nav button.on{background:var(--pri);color:#fff;font-weight:600}
#st{font-size:12.5px;color:var(--mut);margin-left:auto}
#trocar{padding:6px 12px;font-size:13px}
#sair{padding:6px 14px;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.02em;background:var(--pri);border-color:var(--pri);color:#fff}
#sair:hover{background:var(--pri-d)}
main{max-width:1120px;margin:0 auto;padding:16px 16px 48px}
.stamp{width:max-content;max-width:100%;margin:0 auto 14px;padding:3px 14px;border-radius:99px;background:#E4E4EA;color:#55555F;font-size:12.5px}
.stamp:empty{display:none}
h2{font-size:18px;margin:0 0 12px;font-weight:600}
.big{width:100%;padding:14px 18px;font-size:15px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:0 1px 3px rgba(30,30,36,.05)}
.lbl{color:var(--mut);font-size:13px;font-weight:500}
.n{font-size:27px;font-weight:600;line-height:1.25;margin-top:4px}
.card.ok .n{color:var(--ok)}.card.wa .n{color:var(--wa)}.card.er .n{color:var(--er)}
.gauge{grid-column:span 2;display:flex;align-items:center;gap:20px}
.ring{--p:0;position:relative;flex:none;width:92px;height:92px;border-radius:50%;background:conic-gradient(var(--gn) calc(var(--p)*1%),#E9E9EF 0);display:grid;place-items:center}
.ring::after{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--panel)}
.ring b{position:relative;z-index:1;font-size:20px;font-weight:600}
.gauge .n{color:var(--ok);margin-top:0}.gauge .sub{color:var(--mut);font-size:13px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.vazio{grid-column:1/-1;text-align:center;color:var(--mut);padding:28px 10px;background:var(--panel);border-radius:12px;border:1px dashed var(--line)}
.cg{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 14px 12px;box-shadow:0 1px 3px rgba(30,30,36,.06)}
.cg-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;font-size:12.5px;color:var(--mut)}
.ln{display:flex;align-items:flex-start;gap:10px;padding:5px 0;font-size:15px;line-height:1.35}
.ln .ic{flex:none;width:20px;height:20px;color:var(--pri);margin-top:1px}
.ln b{font-weight:600}
.nfs{margin:8px 0 4px;padding:8px 10px;background:var(--panel2);border-radius:10px;display:grid;gap:6px}
.nfl{display:flex;flex-wrap:wrap;gap:4px 10px;justify-content:space-between;align-items:center;font-size:13.5px}
.btns{display:flex;gap:8px;margin-top:10px}
.btns button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;border:0;border-radius:8px;color:#fff;font-weight:500;font-size:13px;letter-spacing:.03em;text-transform:uppercase}
.btns button:hover{filter:brightness(.94)}
.btns .g1{background:var(--gn-d)}.btns .g2{background:var(--gn)}
.btns .g2.off{background:var(--okb);color:var(--ok);cursor:default;filter:none}
.btns svg{width:18px;height:18px}
.bar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}.bar input,.bar select{width:auto;flex:1;min-width:150px}
.tw{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;min-width:760px}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px}
th{font-size:12.5px;color:var(--mut);font-weight:500;background:var(--panel2)}
tbody tr:last-child td{border-bottom:0}
tr.r{cursor:pointer}tr.r:hover{background:#FFF7F3}
.cadt{min-width:520px}
.tag{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.t-ok{background:var(--okb);color:var(--ok)}.t-wa{background:var(--wab);color:var(--wa)}.t-er{background:var(--erb);color:var(--er)}
.mut{color:var(--mut);font-size:13px}
#alerta{border-color:#F6C3AE;background:var(--wab);margin-bottom:16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
#modal{position:fixed;inset:0;background:rgba(20,20,26,.55);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:20px;z-index:40}
.m{position:relative;background:var(--panel);border-radius:16px;width:100%;max-width:840px;padding:24px 22px 0;margin:auto 0}
.m::before{content:"";position:absolute;left:22px;top:0;width:56px;height:3px;background:var(--pri);border-radius:0 0 3px 3px}
.m h2{font-size:22px}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:0 14px}
.row{display:grid;grid-template-columns:1fr 1.5fr 1fr 1.2fr auto;gap:8px;margin-bottom:8px;align-items:center}
.row.dr{grid-template-columns:1.2fr 1fr 1.2fr auto}
.sec{display:flex;justify-content:space-between;align-items:center;margin:22px 0 10px;padding-top:16px;border-top:1px solid var(--line)}.sec h3{margin:0;font-size:16px;font-weight:600}
.act{position:sticky;bottom:0;z-index:2;display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;background:var(--panel);padding:12px 0 calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);margin-top:22px}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.gauge{grid-column:span 2}}
@media(max-width:700px){
 input,select,textarea{font-size:16px;min-height:48px}
 textarea{min-height:96px}
 button{min-height:46px}
 header{padding:10px 14px;gap:8px 10px}
 header .logo{order:1}
 #pt{display:block;order:2;flex:1;text-align:center}
 #trocar{order:3;min-height:38px}#sair{order:3;min-height:38px}
 header nav{order:4;width:100%}
 header nav button{flex:1;padding:9px 6px}
 #st{order:5;width:100%;margin:0;text-align:center}
 main{padding:14px 12px 100px}
 #nova,#nova2{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:25;width:auto;min-height:54px;border-radius:12px;font-size:15px;margin:0;box-shadow:0 6px 20px rgba(240,85,43,.35)}
 .cards{grid-template-columns:1fr}
 .bar input,.bar select{flex:1 1 100%}
 #cad .bar{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}#cad .bar button{flex:none}
 #modal{padding:0;align-items:stretch}
 .m{max-width:none;min-height:100%;border-radius:0;padding:22px 16px 0;margin:0}
 .row,.row.dr{grid-template-columns:1fr 1fr;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel2)}
 .row>input:nth-child(2){grid-column:1/-1}
 .row>button{grid-column:1/-1}
 button[data-del]::after{content:" Remover"}
 .tw{background:transparent;border:0;overflow:visible}
 table.stack,table.stack tbody{display:block;min-width:0}
 table.stack thead{display:none}
 table.stack tr{display:block;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 14px;margin-bottom:12px}
 table.stack td{display:flex;gap:12px;justify-content:space-between;border:0;border-bottom:1px dashed var(--line);padding:9px 0;text-align:right}
 table.stack td:last-child{border-bottom:0}
 table.stack td::before{content:attr(data-l);color:var(--mut);font-size:13px;text-align:left;flex:none}
 table.stack td[colspan]{display:block;text-align:left}table.stack td[colspan]::before{content:none}
 .n{font-size:24px}
}
@media(max-width:480px){.grid{grid-template-columns:1fr}.gauge{grid-column:auto}}
</style>
</head>
<body>

<div id="login">
 <div class="box">
  <div class="logo"><svg viewBox="0 0 32 32" width="34" height="34" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#F0552B"/><path d="M9 10l7 6-7 6M16 10l7 6-7 6" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Controle de Cargas</span></div>
  <h2>Entrar</h2><p>Use o usuário e a senha que você recebeu.</p>
  <label for="u">Usuário</label><input id="u" autocomplete="username">
  <label for="s">Senha</label><input id="s" type="password" autocomplete="current-password">
  <div class="err" id="le" role="alert"></div>
  <button class="p" style="width:100%;margin-top:6px;padding:13px" id="entrar">Entrar</button>
 </div>
</div>

<div id="app" class="hide">
 <header>
  <div class="logo"><svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#F0552B"/><path d="M9 10l7 6-7 6M16 10l7 6-7 6" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Controle</span></div>
  <div id="pt">Painel</div>
  <nav><button data-v="painel" class="on">Painel</button><button data-v="cargas">Cargas</button><button data-v="cadastros" id="navcad" class="hide">Cadastros</button></nav>
  <span id="st" class="mut"></span><button id="trocar" title="Trocar senha">Senha</button><button id="sair">Sair</button>
 </header>
 <main>
  <div id="alerta" class="card hide"><span>⚠️ Você está usando a senha padrão. Troque agora para proteger os dados.</span><button class="p" id="trocar2">Trocar senha</button></div>
  <div class="stamp" id="stamp"></div>
  <section id="painel">
   <button class="p big" id="nova2">+ Lançar nova carga</button>
   <div class="grid" id="cards"></div>
   <h2>Cargas pendentes de entrega</h2>
   <div class="cards" id="pend"></div>
  </section>
  <section id="cargas" class="hide">
   <div class="bar">
    <input id="q" placeholder="Buscar embarcador, destino, nº da carga, NF…">
    <select id="fs"><option value="">Todas as cargas</option><option value="p">Pendentes de entrega</option><option value="c">Concluídas</option><option value="f">Frete ag. pagamento</option><option value="r">Reembolso pendente</option></select>
    <button class="p" id="nova">+ Lançar nova carga</button>
   </div>
   <div class="cards" id="lista"></div>
  </section>
  <section id="cadastros" class="hide"><div id="cad"></div></section>
  <datalist id="dlc"></datalist>
 </main>
</div>

<div id="modal" class="hide"><div class="m" id="mc"></div></div>

<script>
var NS=['Pendente','Entregue','Devolvida Total','Devolvida Parcial'];
var S={cargas:[],clientes:[],motoristas:[],veiculos:[],regioes:[],usuarios:[]},me=null,tok=null,editId=null,cadTab='clientes',cadEd=null;
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function brl(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function dt(s){return s?s.split('-').reverse().join('/'):''}
function done(c){return c.notas.length>0&&c.notas.every(function(n){return n.status!=='Pendente'})}
function sum(a,k){return a.reduce(function(t,x){return t+(+x[k]||0)},0)}
function tag(t,cls){return '<span class="tag t-'+cls+'">'+esc(t)+'</span>'}
function nsTag(s){return tag(s,s==='Entregue'?'ok':s==='Pendente'?'wa':'er')}
function $(i){return document.getElementById(i)}
function vtxt(id){var v=S.veiculos.find(function(x){return x.id===id});return v?v.perfil+' – '+v.placa:'—'}
function mtxt(id){var m=S.motoristas.find(function(x){return x.id===id});return m?m.nome:''}
function fail(e){if(e!==0)alert(typeof e==='string'?e:'Não foi possível concluir. Tente novamente.')}

// ---- Servidor ----
function api(op,body){
 return fetch('/api/app',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+tok},body:JSON.stringify(Object.assign({op:op},body||{}))})
 .then(function(r){return r.json().catch(function(){return{}}).then(function(j){if(r.status===401){sair();throw 0}if(!r.ok)throw (j.error||'Erro no servidor.');return j})});
}
function load(){
 return api('load').then(function(d){S=d.dados;me=d.eu;head();render();$('stamp').textContent='Atualizado em '+new Date().toLocaleString('pt-BR');if(me.papel==='master')renderCad()}).catch(function(e){if(e!==0)$('st').textContent='⚠️ Sem conexão com o servidor'});
}
function head(){
 $('st').textContent=me.usuario+' · '+me.transp+(me.papel==='master'?' (Master)':' (Motorista)');
 $('navcad').classList.toggle('hide',me.papel!=='master');
 $('alerta').classList.toggle('hide',!me.padrao);
 $('dlc').innerHTML=S.clientes.map(function(x){return '<option value="'+esc(x.fantasia||x.razao)+'">'}).join('');
}

// ---- Login ----
function start(){$('login').classList.add('hide');$('app').classList.remove('hide');$('s').value='';load();setInterval(function(){
 if(document.hidden||!$('modal').classList.contains('hide'))return;var a=document.activeElement;if(a&&$('cad').contains(a))return;load()},15000)}
function entrar(){
 $('le').textContent='';
 fetch('/api/app',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({op:'login',user:$('u').value.trim(),pass:$('s').value})})
 .then(function(r){if(r.status===401){$('le').textContent='Usuário ou senha incorretos.';return}if(!r.ok){$('le').textContent='Erro no servidor ('+r.status+'). Confira a variável DATABASE_URL na Vercel e faça Redeploy.';return}return r.json().then(function(j){tok=j.token;try{sessionStorage.setItem('tk',tok)}catch(e){}start()})})
 .catch(function(){$('le').textContent='Sem conexão com o servidor.'});
}
function sair(){try{sessionStorage.removeItem('tk')}catch(e){}location.reload()}
function trocar(){
 var a=prompt('Senha atual:');if(a===null)return;var n=prompt('Nova senha (mínimo 8 caracteres):');if(n===null)return;
 api('pass',{atual:a,nova:n}).then(function(){alert('Senha alterada com sucesso.');load()}).catch(fail);
}
$('entrar').onclick=entrar;$('s').onkeydown=function(e){if(e.key==='Enter')entrar()};$('sair').onclick=sair;$('trocar').onclick=trocar;$('trocar2').onclick=trocar;
try{tok=sessionStorage.getItem('tk');if(tok)start()}catch(e){}

// ---- Navegação ----
document.querySelectorAll('nav button').forEach(function(b){b.onclick=function(){
 document.querySelectorAll('nav button').forEach(function(x){x.classList.toggle('on',x===b)});
 ['painel','cargas','cadastros'].forEach(function(s){$(s).classList.toggle('hide',b.dataset.v!==s)});$('pt').textContent=b.textContent;render()}});

// ---- Painel e lista ----
function rotular(){document.querySelectorAll("table.stack").forEach(function(t){var hd=[].map.call(t.querySelectorAll("th"),function(x){return x.textContent});t.querySelectorAll("tbody tr").forEach(function(tr){[].forEach.call(tr.children,function(td,i){if(hd[i])td.setAttribute("data-l",hd[i])})})})}
var IC={user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',pin:'<path d="M12 21s7-6.2 7-11a7 7 0 10-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/>',truck:'<path d="M2 6h11v9H2zM13 9h4l4 3v3h-8z"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/>',doc:'<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/>',money:'<rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/>',box:'<path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/>',edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>',check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>'};
function ico(k){return '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+IC[k]+'</svg>'}
function cardCarga(x){
 var fin=done(x),cond=x.condutor||mtxt(x.motorista_id),vt=vtxt(x.veiculo_id);
 var nfs=x.notas.length?'<div class="nfs">'+x.notas.map(function(n){return '<div class="nfl"><span>NF '+esc(n.nf)+' · '+esc(n.cliente)+'</span><span>'+brl(n.valor)+' '+nsTag(n.status)+'</span></div>'}).join('')+'<div class="nfl mut"><span>Total das notas</span><span>'+brl(sum(x.notas,'valor'))+'</span></div></div>':'';
 var dps=x.despesas.map(function(d){return '<div class="ln">'+ico('box')+'<span>'+esc(d.tipo)+' '+brl(d.valor)+' '+tag('Reemb. '+d.reemb,d.reemb==='Recebido'?'ok':'wa')+'</span></div>'}).join('');
 return '<article class="cg"><div class="cg-h"><span>'+dt(x.data)+'</span>'+(fin?tag('Concluída','ok'):tag('Pendente entrega','wa'))+'</div>'+
  '<div class="ln">'+ico('user')+'<b>'+esc(x.embarcador)+'</b></div>'+
  (x.destino?'<div class="ln">'+ico('pin')+'<span>'+esc(x.destino)+'</span></div>':'')+
  '<div class="ln">'+ico('truck')+'<span>'+(cond?esc(cond):'<span class="mut">Sem condutor</span>')+(vt!=='—'?' · '+esc(vt):'')+'</span></div>'+
  (x.numero?'<div class="ln">'+ico('doc')+'<span>Carga nº '+esc(x.numero)+'</span></div>':'')+
  '<div class="ln">'+ico('money')+'<span>Frete '+brl(x.frete)+' '+tag(x.pagFrete,x.pagFrete==='Recebido'?'ok':'wa')+'</span></div>'+
  nfs+dps+
  (me&&me.papel==='master'&&x.lancado_por?'<div class="mut" style="padding-top:4px">Lançado por '+esc(x.lancado_por)+'</div>':'')+
  '<div class="btns"><button class="g1" data-ed data-id="'+x.id+'">'+ico('edit')+'Editar</button>'+
  (fin?'<button class="g2 off" disabled>'+ico('check')+'Concluída</button>':'<button class="g2" data-fin data-id="'+x.id+'">'+ico('check')+'Finalizar</button>')+'</div></article>';
}
function finalizar(id){
 var x=S.cargas.find(function(c){return c.id===id});if(!x)return;
 if(!x.notas.some(function(n){return n.status==='Pendente'})){alert('Esta carga não tem notas pendentes. Toque em Editar para lançar as notas fiscais.');return}
 if(!confirm('Marcar todas as notas pendentes como Entregue?'))return;
 var o=JSON.parse(JSON.stringify(x));o.condutor=o.condutor||(me?me.usuario:'');
 o.notas.forEach(function(n){if(n.status==='Pendente')n.status='Entregue'});
 api('save_carga',{carga:o}).then(load).catch(fail);
}
function render(){
 var C=S.cargas,c=C.filter(done).length,p=C.length-c;
 var fr=sum(C.filter(function(x){return x.pagFrete==='Ag. Pagamento'}),'frete'),rb=0,nf=0;
 C.forEach(function(x){x.despesas.forEach(function(d){if(d.reemb==='Pendente')rb+=+d.valor||0});nf+=sum(x.notas,'valor')});
 var tot=C.length,pc=tot?Math.round(c/tot*100):0;
 $('cards').innerHTML=
  '<div class="card gauge"><div class="ring" style="--p:'+pc+'"><b>'+pc+'%</b></div><div><div class="lbl">Cargas concluídas</div><div class="n">'+c+'</div><div class="sub">de '+tot+' cargas lançadas</div></div></div>'+
  '<div class="card wa"><div class="lbl">Pendente entrega</div><div class="n">'+p+'</div></div>'+
  '<div class="card er"><div class="lbl">Frete a receber</div><div class="n">'+brl(fr)+'</div></div>'+
  '<div class="card er"><div class="lbl">Reembolsos pendentes</div><div class="n">'+brl(rb)+'</div></div>'+
  '<div class="card cy"><div class="lbl">Valor total das NFs</div><div class="n">'+brl(nf)+'</div></div>';
 var pe=C.filter(function(x){return !done(x)}).sort(function(a,b){return a.data<b.data?-1:1});
 $('pend').innerHTML=pe.length?pe.map(cardCarga).join(''):'<div class="vazio">Nenhuma carga pendente.</div>';
 var qq=$('q').value.toLowerCase(),f=$('fs').value;
 var L=C.filter(function(x){
  var t=[x.embarcador,x.destino,x.numero,x.lancado_por,x.condutor,vtxt(x.veiculo_id),mtxt(x.motorista_id)].concat(x.notas.map(function(n){return n.nf+' '+n.cliente})).join(' ').toLowerCase();
  if(qq&&t.indexOf(qq)<0)return false;
  if(f==='p'&&done(x))return false;if(f==='c'&&!done(x))return false;
  if(f==='f'&&x.pagFrete!=='Ag. Pagamento')return false;
  if(f==='r'&&!x.despesas.some(function(d){return d.reemb==='Pendente'}))return false;
  return true});
 $('lista').innerHTML=L.length?L.map(cardCarga).join(''):'<div class="vazio">Nenhuma carga encontrada.</div>';
}
['pend','lista'].forEach(function(k){$(k).onclick=function(e){var b=e.target.closest('button[data-ed],button[data-fin]');if(!b)return;var i=+b.dataset.id;if(b.hasAttribute('data-ed'))abrir(i);else finalizar(i)}});
$('q').oninput=render;$('fs').onchange=render;$('nova').onclick=function(){abrir(null)};$('nova2').onclick=function(){abrir(null)};

// ---- Formulário de carga ----
function opts(a,v){return a.map(function(o){return '<option'+(o===v?' selected':'')+'>'+esc(o)+'</option>'}).join('')}
function selTxt(list,cur){var a=list.slice();if(cur&&a.indexOf(cur)<0)a.push(cur);return '<option value="">Selecione…</option>'+a.map(function(o){return '<option'+(o===cur?' selected':'')+'>'+esc(o)+'</option>'}).join('')}
function selId(list,txt,cur){return '<option value="">—</option>'+list.map(function(x){return '<option value="'+x.id+'"'+(x.id===cur?' selected':'')+'>'+esc(txt(x))+'</option>'}).join('')}
function rowNF(n){n=n||{nf:'',cliente:'',valor:'',status:'Pendente'};return '<div class="row nf"><input placeholder="Nº NF" value="'+esc(n.nf)+'"><input list="dlc" placeholder="Cliente da NF" value="'+esc(n.cliente)+'"><input type="number" step="0.01" min="0" placeholder="Valor R$" value="'+esc(n.valor)+'"><select>'+opts(NS,n.status)+'</select><button class="d" type="button" data-del>✕</button></div>'}
function rowDP(d){d=d||{tipo:'Descarga',valor:'',reemb:'Pendente'};return '<div class="row dr dp"><select>'+opts(['Descarga','Mercadoria'],d.tipo)+'</select><input type="number" step="0.01" min="0" placeholder="Valor R$" value="'+esc(d.valor)+'"><select>'+opts(['Pendente','Recebido'],d.reemb)+'</select><button class="d" type="button" data-del>✕</button></div>'}
function abrir(id){
 editId=id;var x=S.cargas.find(function(c){return c.id===id})||{embarcador:'',data:new Date().toISOString().slice(0,10),destino:'',veiculo_id:null,motorista_id:null,condutor:(me.papel==='master'?'':me.usuario),numero:'',frete:'',pagFrete:'Ag. Pagamento',notas:[],despesas:[]};
 $('mc').innerHTML='<h2>'+(id?'Editar carga':'Nova carga')+'</h2><div class="f">'+
 '<div><label>Embarcador (nome do cliente)</label><select id="fc">'+selTxt(S.clientes.map(function(c){return c.fantasia||c.razao}),x.embarcador)+'</select></div>'+
 '<div><label>Data de carregamento</label><input id="fd" type="date" value="'+x.data+'"></div>'+
 '<div><label>Destino (região)</label><select id="fr">'+selTxt(S.regioes.map(function(r){return r.nome}),x.destino)+'</select></div>'+
 '<div><label>Nº da carga do cliente</label><input id="fx" value="'+esc(x.numero)+'"></div>'+
 '<div><label>Veículo (placa)</label><select id="fv">'+selId(S.veiculos,function(v){return v.perfil+' – '+v.placa},x.veiculo_id)+'</select></div>'+
 '<div><label>Condutor (motorista) *</label><input id="fo" value="'+esc(x.condutor)+'" placeholder="Nome de quem dirige"></div>'+
 '<div><label>Frete R$</label><input id="ff" type="number" step="0.01" min="0" value="'+esc(x.frete)+'"></div>'+
 '<div><label>Status pagamento</label><select id="fp">'+opts(['Ag. Pagamento','Recebido'],x.pagFrete)+'</select></div></div>'+
 '<div class="sec"><h3>Notas fiscais desta carga</h3><button type="button" id="addnf">+ Adicionar NF</button></div><div id="nfs">'+x.notas.map(rowNF).join('')+'</div>'+
 '<div class="sec"><h3>Despesas adicionais e reembolso</h3><button type="button" id="adddp">+ Adicionar despesa</button></div><div id="dps">'+x.despesas.map(rowDP).join('')+'</div>'+
 '<div class="err" id="fe"></div><div class="act"><div>'+(id?'<button class="d" id="excl">Excluir carga</button>':'')+'</div><div><button id="canc">Cancelar</button> <button class="p" id="salv">Salvar</button></div></div>';
 $('modal').classList.remove('hide');
 $('addnf').onclick=function(){$('nfs').insertAdjacentHTML('beforeend',rowNF())};
 $('adddp').onclick=function(){$('dps').insertAdjacentHTML('beforeend',rowDP())};
 $('mc').onclick=function(e){if(e.target.hasAttribute('data-del'))e.target.parentNode.remove()};
 $('canc').onclick=fechar;$('salv').onclick=salvar;
 if($('excl'))$('excl').onclick=function(){if(confirm('Excluir esta carga?'))api('del_carga',{id:editId}).then(load).then(fechar).catch(fail)};
}
function fechar(){$('modal').classList.add('hide');render()}
function salvar(){
 var cli=$('fc').value.trim();if(!cli||!$('fd').value){$('fe').textContent='Escolha o embarcador e a data de carregamento.';return}
 if(!$('fo').value.trim()){$('fe').textContent='Informe o condutor.';return}
 var notas=[].map.call(document.querySelectorAll('.row.nf'),function(r){var i=r.querySelectorAll('input,select');return{nf:i[0].value.trim(),cliente:i[1].value.trim(),valor:+i[2].value||0,status:i[3].value}}).filter(function(n){return n.nf||n.cliente||n.valor});
 var desp=[].map.call(document.querySelectorAll('.row.dp'),function(r){var i=r.querySelectorAll('input,select');return{tipo:i[0].value,valor:+i[1].value||0,reemb:i[2].value}}).filter(function(d){return d.valor});
 var o={id:editId,embarcador:cli,data:$('fd').value,destino:$('fr').value,numero:$('fx').value.trim(),veiculo_id:+$('fv').value||null,motorista_id:null,condutor:$('fo').value.trim(),frete:+$('ff').value||0,pagFrete:$('fp').value,notas:notas,despesas:desp};
 $('salv').disabled=true;
 api('save_carga',{carga:o}).then(load).then(fechar).catch(function(e){$('salv').disabled=false;fail(e)});
}

// ---- Cadastros (somente Master) ----
var CAT=['A','B','C','D','E','AB','AC','AD','AE'],PERF=['Utilitário','VUC','3/4','Toco','Truck','Bitruck','Carreta','Bi-trem','Rodotrem'];
var CFG={clientes:{t:'Clientes',s:'cliente',f:[['razao','Razão Social'],['fantasia','Nome Fantasia'],['cnpj','CNPJ'],['endereco','Endereço'],['contato','Contato']]},
motoristas:{t:'Motoristas',s:'motorista',f:[['nome','Nome'],['cnh','CNH'],['cat','Categoria',CAT]]},
veiculos:{t:'Veículos',s:'veículo',f:[['perfil','Perfil',PERF],['placa','Placa']]},
regioes:{t:'Regiões (destinos)',s:'região',f:[['nome','Nome da região']]},
usuarios:{t:'Acessos dos motoristas',s:'acesso',f:[['usuario','Usuário (login)'],['senha','Senha (vazio = manter)',null,'password'],['ativo','Acesso ativo',['Sim','Não']]]}};
function renderCad(){
 var c=CFG[cadTab],cur=cadEd!=null?S[cadTab][cadEd]:{};
 var h='<div class="bar">'+Object.keys(CFG).map(function(k){return '<button data-ct="'+k+'" class="'+(k===cadTab?'p':'')+'">'+CFG[k].t+' ('+S[k].length+')</button>'}).join('')+'</div>';
 h+='<div class="card" style="margin-bottom:14px"><h2>'+(cadEd!=null?'Editar ':'Novo ')+c.s+'</h2><div class="f">'+c.f.map(function(f){
  return '<div><label>'+f[1]+'</label>'+(f[2]?'<select id="cf_'+f[0]+'">'+opts(f[2],cur[f[0]]||f[2][0])+'</select>':'<input id="cf_'+f[0]+'" type="'+(f[3]||'text')+'" autocomplete="new-password" value="'+(f[3]?'':esc(cur[f[0]]))+'">')+'</div>'}).join('')+'</div><div class="err" id="ce"></div><div class="act"><div></div><div>'+(cadEd!=null?'<button data-cc>Cancelar</button> ':'')+'<button class="p" data-cs>'+(cadEd!=null?'Salvar alterações':'Cadastrar')+'</button></div></div></div>';
 var cols=c.f.filter(function(f){return f[3]!=='password'});
 h+='<div class="tw"><table class="stack cadt"><thead><tr>'+cols.map(function(f){return '<th>'+f[1]+'</th>'}).join('')+'<th></th></tr></thead><tbody>'+
  (S[cadTab].length?S[cadTab].map(function(r,i){return '<tr class="r" data-i="'+i+'">'+cols.map(function(f){return '<td>'+esc(r[f[0]])+'</td>'}).join('')+'<td><button class="d" data-rm="'+i+'">Excluir</button></td></tr>'}).join(''):'<tr><td colspan="'+(cols.length+1)+'" class="mut">Nada cadastrado ainda.</td></tr>')+'</tbody></table></div>';
 if(cadTab==='usuarios')h+='<div class="card" style="margin-top:14px"><h2>Cadastrar vários motoristas de uma vez</h2><div class="mut" style="margin-bottom:8px">Um por linha, no formato <b>usuario;senha</b> (senha com 6 ou mais caracteres). Até 100 por vez.</div><textarea id="bulk" rows="5" style="width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit" placeholder="joao.silva;Senha123\nmaria.souza;Senha456"></textarea><div class="act"><div class="mut" id="be"></div><button class="p" data-bulk>Cadastrar lista</button></div></div>';
 $('cad').innerHTML=h;rotular();
}
$('cad').onclick=function(e){var t=e.target,b;
 if(t.closest('[data-bulk]')){var tx=$('bulk').value;if(!tx.trim()){$('be').textContent='Cole a lista primeiro.';return}
  api('bulk_users',{texto:tx}).then(function(r){alert('Criados: '+r.criados+'\nJá existiam: '+r.repetidos+'\nLinhas inválidas: '+r.invalidos);return load()}).then(function(){renderCad()}).catch(fail);return}
 if(b=t.closest('[data-ct]')){cadTab=b.dataset.ct;cadEd=null;renderCad();return}
 if(t.closest('[data-cc]')){cadEd=null;renderCad();return}
 if(b=t.closest('[data-rm]')){if(confirm('Excluir este cadastro?'))api('del_cad',{tab:cadTab,id:S[cadTab][+b.dataset.rm].id}).then(load).then(function(){cadEd=null;renderCad()}).catch(fail);return}
 if(t.closest('[data-cs]')){var o={id:cadEd!=null?S[cadTab][cadEd].id:0};CFG[cadTab].f.forEach(function(f){o[f[0]]=$('cf_'+f[0]).value});
  api('save_cad',{tab:cadTab,rec:o}).then(load).then(function(){cadEd=null;renderCad()}).catch(function(e){$('ce').textContent=typeof e==='string'?e:'Não foi possível salvar.'});return}
 if(b=t.closest('tr.r')){cadEd=+b.dataset.i;renderCad();window.scrollTo(0,0)}
};
</script>
</body>
