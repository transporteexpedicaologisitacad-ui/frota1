<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Controle · Transportadora</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--tx:#18202b;--mut:#657083;--bd:#dde2ea;--pri:#1f5fbf;--ok:#16794a;--okb:#e2f5ea;--wa:#9a5b00;--wab:#fff0d6;--er:#b42318;--erb:#fde7e5;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#10141a;--card:#1a212b;--tx:#e8edf3;--mut:#93a0b2;--bd:#2d3746;--pri:#5b9bff;--ok:#5ad19a;--okb:#12301f;--wa:#f2b34d;--wab:#392a0c;--er:#ff8a80;--erb:#3d1815;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.hide{display:none!important}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:28px;width:100%;max-width:360px}
.box h1{margin:0 0 4px;font-size:22px}.box p{margin:0 0 18px;color:var(--mut)}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px;font-weight:600}
input,select{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px}
button.p{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
button.d{color:var(--er)}
.err{color:var(--er);font-size:13px;min-height:18px;margin-top:8px}
header{display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5;flex-wrap:wrap}
header b{font-size:17px}header nav{display:flex;gap:6px;flex:1}
nav button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
main{max-width:1100px;margin:0 auto;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:22px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px}
.card small{color:var(--mut);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.card .n{font-size:30px;font-weight:700;margin-top:4px}
.card.ok .n{color:var(--ok)}.card.wa .n{color:var(--wa)}.card.er .n{color:var(--er)}
h2{font-size:17px;margin:0 0 12px}
.bar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}.bar input,.bar select{width:auto;flex:1;min-width:140px}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--bd);border-radius:12px}
table{width:100%;border-collapse:collapse;min-width:760px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--bd);vertical-align:top;font-size:14px}
th{font-size:12px;color:var(--mut);text-transform:uppercase}
tr.r{cursor:pointer}tr.r:hover{background:var(--bg)}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.t-ok{background:var(--okb);color:var(--ok)}.t-wa{background:var(--wab);color:var(--wa)}.t-er{background:var(--erb);color:var(--er)}
.mut{color:var(--mut);font-size:13px}
#alerta{background:var(--wab);color:var(--wa);border-color:var(--wa);margin-bottom:16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:20px;z-index:20}
.m{background:var(--card);border-radius:14px;width:100%;max-width:820px;padding:22px;border:1px solid var(--bd)}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:0 12px}
.row{display:grid;grid-template-columns:1fr 1.5fr 1fr 1.2fr auto;gap:8px;margin-bottom:8px;align-items:center}
.row.dr{grid-template-columns:1.2fr 1fr 1.2fr auto}
@media(max-width:640px){.row,.row.dr{grid-template-columns:1fr 1fr}}
.sec{display:flex;justify-content:space-between;align-items:center;margin:20px 0 8px}.sec h3{margin:0;font-size:15px}
.act{display:flex;gap:8px;justify-content:space-between;margin-top:20px}
</style>
</head>
<body>

<div id="login">
 <div class="box">
  <h1>🚚 Controle de Cargas</h1><p>Acesse com seu usuário e senha</p>
  <label>Usuário</label><input id="u" autocomplete="username">
  <label>Senha</label><input id="s" type="password" autocomplete="current-password">
  <div class="err" id="le"></div>
  <button class="p" style="width:100%;margin-top:6px" id="entrar">Entrar</button>
 </div>
</div>

<div id="app" class="hide">
 <header>
  <b>🚚 Controle</b>
  <nav><button data-v="painel" class="on">Painel</button><button data-v="cargas">Cargas</button><button data-v="cadastros" id="navcad" class="hide">Cadastros</button></nav>
  <span id="st" class="mut"></span><button id="trocar">Trocar senha</button><button id="sair">Sair</button>
 </header>
 <main>
  <div id="alerta" class="card hide"><span>⚠️ Você está usando a senha padrão. Troque agora para proteger os dados.</span><button class="p" id="trocar2">Trocar senha</button></div>
  <section id="painel">
   <div class="grid" id="cards"></div>
   <h2>Cargas pendentes de entrega</h2>
   <div class="tw"><table><thead><tr><th>Data</th><th>Embarcador</th><th>Destino</th><th>Veículo</th><th>NFs pendentes</th></tr></thead><tbody id="pend"></tbody></table></div>
  </section>
  <section id="cargas" class="hide">
   <div class="bar">
    <input id="q" placeholder="Buscar embarcador, destino, nº da carga, NF…">
    <select id="fs"><option value="">Todas as cargas</option><option value="p">Pendentes de entrega</option><option value="c">Concluídas</option><option value="f">Frete ag. pagamento</option><option value="r">Reembolso pendente</option></select>
    <button class="p" id="nova">+ Nova carga</button>
   </div>
   <div class="tw"><table><thead><tr><th>Data</th><th>Embarcador / Destino</th><th>Veículo · Nº da carga</th><th>Notas fiscais</th><th>Frete</th><th>Despesas</th><th>Situação</th></tr></thead><tbody id="lista"></tbody></table></div>
  </section>
  <section id="cadastros" class="hide"><div id="cad"></div></section>
  <datalist id="dlc"></datalist>
 </main>
</div>

<div id="modal" class="hide"><div class="m" id="mc"></div></div>

<script>
var NS=['Pendente','Entregue','Devolvida Total','Devolvida Parcial'];
var S={cargas:[],clientes:[],motoristas:[],veiculos:[],regioes:[],usuarios:[]},me=null,tok=null,editId=null,cadTab='clientes',cadEd=null;
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function brl(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function dt(s){return s?s.split('-').reverse().join('/'):''}
function done(c){return c.notas.length>0&&c.notas.every(function(n){return n.status!=='Pendente'})}
function sum(a,k){return a.reduce(function(t,x){return t+(+x[k]||0)},0)}
function tag(t,cls){return '<span class="tag t-'+cls+'">'+esc(t)+'</span>'}
function nsTag(s){return tag(s,s==='Entregue'?'ok':s==='Pendente'?'wa':'er')}
function $(i){return document.getElementById(i)}
function vtxt(id){var v=S.veiculos.find(function(x){return x.id===id});return v?v.perfil+' – '+v.placa:'—'}
function mtxt(id){var m=S.motoristas.find(function(x){return x.id===id});return m?m.nome:''}
function fail(e){if(e!==0)alert(typeof e==='string'?e:'Não foi possível concluir. Tente novamente.')}

// ---- Servidor ----
function api(op,body){
 return fetch('/api/app',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+tok},body:JSON.stringify(Object.assign({op:op},body||{}))})
 .then(function(r){return r.json().catch(function(){return{}}).then(function(j){if(r.status===401){sair();throw 0}if(!r.ok)throw (j.error||'Erro no servidor.');return j})});
}
function load(){
 return api('load').then(function(d){S=d.dados;me=d.eu;head();render();if(me.papel==='master')renderCad()}).catch(function(e){if(e!==0)$('st').textContent='⚠️ Sem conexão com o servidor'});
}
function head(){
 $('st').textContent=me.usuario+' · '+me.transp+(me.papel==='master'?' (Master)':' (Motorista)');
 $('navcad').classList.toggle('hide',me.papel!=='master');
 $('alerta').classList.toggle('hide',!me.padrao);
 $('dlc').innerHTML=S.clientes.map(function(x){return '<option value="'+esc(x.fantasia||x.razao)+'">'}).join('');
}

// ---- Login ----
function start(){$('login').classList.add('hide');$('app').classList.remove('hide');$('s').value='';load();setInterval(function(){
 if(document.hidden||!$('modal').classList.contains('hide'))return;var a=document.activeElement;if(a&&$('cad').contains(a))return;load()},15000)}
function entrar(){
 $('le').textContent='';
 fetch('/api/app',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({op:'login',user:$('u').value.trim(),pass:$('s').value})})
 .then(function(r){if(r.status===401){$('le').textContent='Usuário ou senha incorretos.';return}if(!r.ok){$('le').textContent='Erro no servidor ('+r.status+'). Confira a variável DATABASE_URL na Vercel e faça Redeploy.';return}return r.json().then(function(j){tok=j.token;try{sessionStorage.setItem('tk',tok)}catch(e){}start()})})
 .catch(function(){$('le').textContent='Sem conexão com o servidor.'});
}
function sair(){try{sessionStorage.removeItem('tk')}catch(e){}location.reload()}
function trocar(){
 var a=prompt('Senha atual:');if(a===null)return;var n=prompt('Nova senha (mínimo 8 caracteres):');if(n===null)return;
 api('pass',{atual:a,nova:n}).then(function(){alert('Senha alterada com sucesso.');load()}).catch(fail);
}
$('entrar').onclick=entrar;$('s').onkeydown=function(e){if(e.key==='Enter')entrar()};$('sair').onclick=sair;$('trocar').onclick=trocar;$('trocar2').onclick=trocar;
try{tok=sessionStorage.getItem('tk');if(tok)start()}catch(e){}

// ---- Navegação ----
document.querySelectorAll('nav button').forEach(function(b){b.onclick=function(){
 document.querySelectorAll('nav button').forEach(function(x){x.classList.toggle('on',x===b)});
 ['painel','cargas','cadastros'].forEach(function(s){$(s).classList.toggle('hide',b.dataset.v!==s)});render()}});

// ---- Painel e lista ----
function render(){
 var C=S.cargas,c=C.filter(done).length,p=C.length-c;
 var fr=sum(C.filter(function(x){return x.pagFrete==='Ag. Pagamento'}),'frete'),rb=0,nf=0;
 C.forEach(function(x){x.despesas.forEach(function(d){if(d.reemb==='Pendente')rb+=+d.valor||0});nf+=sum(x.notas,'valor')});
 $('cards').innerHTML=
  '<div class="card ok"><small>Cargas concluídas</small><div class="n">'+c+'</div></div>'+
  '<div class="card wa"><small>Pendente entrega</small><div class="n">'+p+'</div></div>'+
  '<div class="card er"><small>Frete a receber</small><div class="n">'+brl(fr)+'</div></div>'+
  '<div class="card er"><small>Reembolsos pendentes</small><div class="n">'+brl(rb)+'</div></div>'+
  '<div class="card"><small>Valor total das NFs</small><div class="n">'+brl(nf)+'</div></div>';
 var pe=C.filter(function(x){return !done(x)}).sort(function(a,b){return a.data<b.data?-1:1});
 $('pend').innerHTML=pe.length?pe.map(function(x){var n=x.notas.filter(function(y){return y.status==='Pendente'});
  return '<tr class="r" data-id="'+x.id+'"><td>'+dt(x.data)+'</td><td>'+esc(x.embarcador)+'</td><td>'+esc(x.destino)+'</td><td>'+esc(vtxt(x.veiculo_id))+'</td><td>'+(n.length?n.map(function(y){return 'NF '+esc(y.nf)+' – '+esc(y.cliente)}).join('<br>'):'<span class="mut">Sem notas lançadas</span>')+'</td></tr>'}).join(''):'<tr><td colspan="5" class="mut">Nenhuma carga pendente.</td></tr>';
 var qq=$('q').value.toLowerCase(),f=$('fs').value;
 var L=C.filter(function(x){
  var t=[x.embarcador,x.destino,x.numero,x.lancado_por,x.condutor,vtxt(x.veiculo_id),mtxt(x.motorista_id)].concat(x.notas.map(function(n){return n.nf+' '+n.cliente})).join(' ').toLowerCase();
  if(qq&&t.indexOf(qq)<0)return false;
  if(f==='p'&&done(x))return false;if(f==='c'&&!done(x))return false;
  if(f==='f'&&x.pagFrete!=='Ag. Pagamento')return false;
  if(f==='r'&&!x.despesas.some(function(d){return d.reemb==='Pendente'}))return false;
  return true});
 $('lista').innerHTML=L.length?L.map(function(x){
  return '<tr class="r" data-id="'+x.id+'"><td>'+dt(x.data)+'</td><td><b>'+esc(x.embarcador)+'</b><br><span class="mut">'+esc(x.destino)+(me.papel==='master'&&x.lancado_por?' · 👤 '+esc(x.lancado_por):'')+'</span></td>'+
  '<td>'+esc(vtxt(x.veiculo_id))+((x.condutor||mtxt(x.motorista_id))?' · '+esc(x.condutor||mtxt(x.motorista_id)):'')+'<br><span class="mut">'+(x.numero?'Carga nº '+esc(x.numero):'')+'</span></td>'+
  '<td>'+(x.notas.map(function(n){return 'NF '+esc(n.nf)+' · '+esc(n.cliente)+' · '+brl(n.valor)+' '+nsTag(n.status)}).join('<br>')||'<span class="mut">—</span>')+'<div class="mut">Total: '+brl(sum(x.notas,'valor'))+'</div></td>'+
  '<td>'+brl(x.frete)+'<br>'+tag(x.pagFrete,x.pagFrete==='Recebido'?'ok':'wa')+'</td>'+
  '<td>'+(x.despesas.map(function(d){return esc(d.tipo)+' '+brl(d.valor)+' '+tag('Reemb. '+d.reemb,d.reemb==='Recebido'?'ok':'wa')}).join('<br>')||'<span class="mut">—</span>')+'</td>'+
  '<td>'+(done(x)?tag('Concluída','ok'):tag('Pendente entrega','wa'))+'</td></tr>'}).join(''):'<tr><td colspan="7" class="mut">Nenhuma carga encontrada.</td></tr>';
}
['pend','lista'].forEach(function(id){$(id).onclick=function(e){var r=e.target.closest('tr.r');if(r)abrir(+r.dataset.id)}});
$('q').oninput=render;$('fs').onchange=render;$('nova').onclick=function(){abrir(null)};

// ---- Formulário de carga ----
function opts(a,v){return a.map(function(o){return '<option'+(o===v?' selected':'')+'>'+esc(o)+'</option>'}).join('')}
function selTxt(list,cur){var a=list.slice();if(cur&&a.indexOf(cur)<0)a.push(cur);return '<option value="">Selecione…</option>'+a.map(function(o){return '<option'+(o===cur?' selected':'')+'>'+esc(o)+'</option>'}).join('')}
function selId(list,txt,cur){return '<option value="">—</option>'+list.map(function(x){return '<option value="'+x.id+'"'+(x.id===cur?' selected':'')+'>'+esc(txt(x))+'</option>'}).join('')}
function rowNF(n){n=n||{nf:'',cliente:'',valor:'',status:'Pendente'};return '<div class="row nf"><input placeholder="Nº NF" value="'+esc(n.nf)+'"><input list="dlc" placeholder="Cliente da NF" value="'+esc(n.cliente)+'"><input type="number" step="0.01" min="0" placeholder="Valor R$" value="'+esc(n.valor)+'"><select>'+opts(NS,n.status)+'</select><button class="d" type="button" data-del>✕</button></div>'}
function rowDP(d){d=d||{tipo:'Descarga',valor:'',reemb:'Pendente'};return '<div class="row dr dp"><select>'+opts(['Descarga','Mercadoria'],d.tipo)+'</select><input type="number" step="0.01" min="0" placeholder="Valor R$" value="'+esc(d.valor)+'"><select>'+opts(['Pendente','Recebido'],d.reemb)+'</select><button class="d" type="button" data-del>✕</button></div>'}
function abrir(id){
 editId=id;var x=S.cargas.find(function(c){return c.id===id})||{embarcador:'',data:new Date().toISOString().slice(0,10),destino:'',veiculo_id:null,motorista_id:null,condutor:(me.papel==='master'?'':me.usuario),numero:'',frete:'',pagFrete:'Ag. Pagamento',notas:[],despesas:[]};
 $('mc').innerHTML='<h2>'+(id?'Editar carga':'Nova carga')+'</h2><div class="f">'+
 '<div><label>Embarcador (nome do cliente)</label><select id="fc">'+selTxt(S.clientes.map(function(c){return c.fantasia||c.razao}),x.embarcador)+'</select></div>'+
 '<div><label>Data de carregamento</label><input id="fd" type="date" value="'+x.data+'"></div>'+
 '<div><label>Destino (região)</label><select id="fr">'+selTxt(S.regioes.map(function(r){return r.nome}),x.destino)+'</select></div>'+
 '<div><label>Nº da carga do cliente</label><input id="fx" value="'+esc(x.numero)+'"></div>'+
 '<div><label>Veículo (placa)</label><select id="fv">'+selId(S.veiculos,function(v){return v.perfil+' – '+v.placa},x.veiculo_id)+'</select></div>'+
 '<div><label>Condutor (motorista) *</label><input id="fo" value="'+esc(x.condutor)+'" placeholder="Nome de quem dirige"></div>'+'</div><div><button id="canc">Cancelar</button> <button class="p" id="salv">Salvar</button></div></div>';
 $('modal').classList.remove('hide');
 $('addnf').onclick=function(){$('nfs').insertAdjacentHTML('beforeend',rowNF())};
 $('adddp').onclick=function(){$('dps').insertAdjacentHTML('beforeend',rowDP())};
 $('mc').onclick=function(e){if(e.target.hasAttribute('data-del'))e.target.parentNode.remove()};
 $('canc').onclick=fechar;$('salv').onclick=salvar;
 if($('excl'))$('excl').onclick=function(){if(confirm('Excluir esta carga?'))api('del_carga',{id:editId}).then(load).then(fechar).catch(fail)};
}
function fechar(){$('modal').classList.add('hide');render()}
function salvar(){
 var cli=$('fc').value.trim();if(!cli||!$('fd').value){$('fe').textContent='Escolha o embarcador e a data de carregamento.';return}
 if(!$('fo').value.trim()){$('fe').textContent='Informe o condutor.';return}
 var notas=[].map.call(document.querySelectorAll('.row.nf'),function(r){var i=r.querySelectorAll('input,select');return{nf:i[0].value.trim(),cliente:i[1].value.trim(),valor:+i[2].value||0,status:i[3].value}}).filter(function(n){return n.nf||n.cliente||n.valor});
 var desp=[].map.call(document.querySelectorAll('.row.dp'),function(r){var i=r.querySelectorAll('input,select');return{tipo:i[0].value,valor:+i[1].value||0,reemb:i[2].value}}).filter(function(d){return d.valor});
 var o={id:editId,embarcador:cli,data:$('fd').value,destino:$('fr').value,numero:$('fx').value.trim(),veiculo_id:+$('fv').value||null,motorista_id:null,condutor:$('fo').value.trim(),frete:+$('ff').value||0,pagFrete:$('fp').value,notas:notas,despesas:desp};
 $('salv').disabled=true;
 api('save_carga',{carga:o}).then(load).then(fechar).catch(function(e){$('salv').disabled=false;fail(e)});
}

// ---- Cadastros (somente Master) ----
var CAT=['A','B','C','D','E','AB','AC','AD','AE'],PERF=['Utilitário','VUC','3/4','Toco','Truck','Bitruck','Carreta','Bi-trem','Rodotrem'];
var CFG={clientes:{t:'Clientes',s:'cliente',f:[['razao','Razão Social'],['fantasia','Nome Fantasia'],['cnpj','CNPJ'],['endereco','Endereço'],['contato','Contato']]},
motoristas:{t:'Motoristas',s:'motorista',f:[['nome','Nome'],['cnh','CNH'],['cat','Categoria',CAT]]},
veiculos:{t:'Veículos',s:'veículo',f:[['perfil','Perfil',PERF],['placa','Placa']]},
regioes:{t:'Regiões (destinos)',s:'região',f:[['nome','Nome da região']]},
usuarios:{t:'Acessos dos motoristas',s:'acesso',f:[['usuario','Usuário (login)'],['senha','Senha (vazio = manter)',null,'password'],['ativo','Acesso ativo',['Sim','Não']]]}};
function renderCad(){
 var c=CFG[cadTab],cur=cadEd!=null?S[cadTab][cadEd]:{};
 var h='<div class="bar">'+Object.keys(CFG).map(function(k){return '<button data-ct="'+k+'" class="'+(k===cadTab?'p':'')+'">'+CFG[k].t+' ('+S[k].length+')</button>'}).join('')+'</div>';
 h+='<div class="card" style="margin-bottom:14px"><h2>'+(cadEd!=null?'Editar ':'Novo ')+c.s+'</h2><div class="f">'+c.f.map(function(f){
  return '<div><label>'+f[1]+'</label>'+(f[2]?'<select id="cf_'+f[0]+'">'+opts(f[2],cur[f[0]]||f[2][0])+'</select>':'<input id="cf_'+f[0]+'" type="'+(f[3]||'text')+'" autocomplete="new-password" value="'+(f[3]?'':esc(cur[f[0]]))+'">')+'</div>'}).join('')+'</div><div class="err" id="ce"></div><div class="act"><div></div><div>'+(cadEd!=null?'<button data-cc>Cancelar</button> ':'')+'<button class="p" data-cs>'+(cadEd!=null?'Salvar alterações':'Cadastrar')+'</button></div></div></div>';
 var cols=c.f.filter(function(f){return f[3]!=='password'});
 h+='<div class="tw"><table style="min-width:520px"><thead><tr>'+cols.map(function(f){return '<th>'+f[1]+'</th>'}).join('')+'<th></th></tr></thead><tbody>'+
  (S[cadTab].length?S[cadTab].map(function(r,i){return '<tr class="r" data-i="'+i+'">'+cols.map(function(f){return '<td>'+esc(r[f[0]])+'</td>'}).join('')+'<td><button class="d" data-rm="'+i+'">Excluir</button></td></tr>'}).join(''):'<tr><td colspan="'+(cols.length+1)+'" class="mut">Nada cadastrado ainda.</td></tr>')+'</tbody></table></div>';
 if(cadTab==='usuarios')h+='<div class="card" style="margin-top:14px"><h2>Cadastrar vários motoristas de uma vez</h2><div class="mut" style="margin-bottom:8px">Um por linha, no formato <b>usuario;senha</b> (senha com 6 ou mais caracteres). Até 100 por vez.</div><textarea id="bulk" rows="5" style="width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit" placeholder="joao.silva;Senha123\nmaria.souza;Senha456"></textarea><div class="act"><div class="mut" id="be"></div><button class="p" data-bulk>Cadastrar lista</button></div></div>';
 $('cad').innerHTML=h;
}
$('cad').onclick=function(e){var t=e.target,b;
 if(t.closest('[data-bulk]')){var tx=$('bulk').value;if(!tx.trim()){$('be').textContent='Cole a lista primeiro.';return}
  api('bulk_users',{texto:tx}).then(function(r){alert('Criados: '+r.criados+'\nJá existiam: '+r.repetidos+'\nLinhas inválidas: '+r.invalidos);return load()}).then(function(){renderCad()}).catch(fail);return}
 if(b=t.closest('[data-ct]')){cadTab=b.dataset.ct;cadEd=null;renderCad();return}
 if(t.closest('[data-cc]')){cadEd=null;renderCad();return}
 if(b=t.closest('[data-rm]')){if(confirm('Excluir este cadastro?'))api('del_cad',{tab:cadTab,id:S[cadTab][+b.dataset.rm].id}).then(load).then(function(){cadEd=null;renderCad()}).catch(fail);return}
 if(t.closest('[data-cs]')){var o={id:cadEd!=null?S[cadTab][cadEd].id:0};CFG[cadTab].f.forEach(function(f){o[f[0]]=$('cf_'+f[0]).value});
  api('save_cad',{tab:cadTab,rec:o}).then(load).then(function(){cadEd=null;renderCad()}).catch(function(e){$('ce').textContent=typeof e==='string'?e:'Não foi possível salvar.'});return}
 if(b=t.closest('tr.r')){cadEd=+b.dataset.i;renderCad();window.scrollTo(0,0)}
};
</script>
